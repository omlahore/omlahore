name: Regenerate profile stats

# The profile used to pull these numbers from third party services. They all
# failed at once, three of them with HTTP 402 because the hosts had hit their
# spending limits. This generates the same thing from the API and commits it,
# so the only thing that can break the profile is this repository.

on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour so it is not queued with everyone else
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/gen_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_stats.py

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- assets/stats.svg assets/languages.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git commit -m "Update profile stats"
          git push
