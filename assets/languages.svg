<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-label="Languages by lines changed in pull requests to other people's repositories: Go 57 percent, TypeScript 36 percent, Python 5 percent, JavaScript 2 percent.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .nm { fill: #c9d3df } .pc { fill: #5b6673 } .hd { fill: #5b6673 }
    .lg { opacity: 0; animation: fade .5s ease-out forwards }
    @keyframes fade { to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .lg { animation: none; opacity: 1 } }
  </style>
  <rect width="880" height="150" rx="10" fill="#11151c" stroke="#1b2330"/>
  <text class="mono hd" x="20" y="26" font-size="11.5">what I wrote, in repositories I do not own</text>
  <rect x="20.0" y="46" width="475.0" height="14" fill="#7dcfff" rx="4"/>
<rect x="495.0" y="46" width="301.5" height="14" fill="#7aa2f7" rx="0"/>
<rect x="796.5" y="46" width="42.8" height="14" fill="#9ece6a" rx="0"/>
<rect x="839.3" y="46" width="20.7" height="14" fill="#e0af68" rx="0"/>
  <g class="lg" style="animation-delay:0.00s"><circle cx="24" cy="88" r="4.5" fill="#7dcfff"/><text class="mono nm" x="36" y="92" font-size="12.5">Go</text><text class="mono pc" x="61.2" y="92" font-size="12.5">56.6%</text></g>
<g class="lg" style="animation-delay:0.08s"><circle cx="314" cy="88" r="4.5" fill="#7aa2f7"/><text class="mono nm" x="326" y="92" font-size="12.5">TypeScript</text><text class="mono pc" x="412.0" y="92" font-size="12.5">35.9%</text></g>
<g class="lg" style="animation-delay:0.16s"><circle cx="604" cy="88" r="4.5" fill="#9ece6a"/><text class="mono nm" x="616" y="92" font-size="12.5">Python</text><text class="mono pc" x="671.6" y="92" font-size="12.5">5.1%</text></g>
<g class="lg" style="animation-delay:0.24s"><circle cx="24" cy="114" r="4.5" fill="#e0af68"/><text class="mono nm" x="36" y="118" font-size="12.5">JavaScript</text><text class="mono pc" x="122.0" y="118" font-size="12.5">2.5%</text></g>
</svg>
