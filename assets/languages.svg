<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-label="Languages by lines changed in pull requests to other people's repositories: Go 78 percent, TypeScript 15 percent, Python 3 percent, JavaScript 2 percent, YAML 1 percent.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .nm { fill: #c9d3df } .pc { fill: #5b6673 } .hd { fill: #5b6673 }
    .lg { opacity: 0; animation: fade .5s ease-out forwards }
    @keyframes fade { to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .lg { animation: none; opacity: 1 } }
