<rect x="678.5" y="46" width="127.6" height="14" fill="#7aa2f7" rx="0"/>
<rect x="806.2" y="46" width="28.9" height="14" fill="#9ece6a" rx="0"/>
<rect x="835.0" y="46" width="12.9" height="14" fill="#e0af68" rx="0"/>
<rect x="847.9" y="46" width="12.1" height="14" fill="#bb9af7" rx="0"/>
  <g class="lg" style="animation-delay:0.00s"><circle cx="24" cy="88" r="4.5" fill="#7dcfff"/><text class="mono nm" x="36" y="92" font-size="12.5">Go</text><text class="mono pc" x="61.2" y="92" font-size="12.5">78.4%</text></g>
<g class="lg" style="animation-delay:0.08s"><circle cx="314" cy="88" r="4.5" fill="#7aa2f7"/><text class="mono nm" x="326" y="92" font-size="12.5">TypeScript</text><text class="mono pc" x="412.0" y="92" font-size="12.5">15.2%</text></g>
<g class="lg" style="animation-delay:0.16s"><circle cx="604" cy="88" r="4.5" fill="#9ece6a"/><text class="mono nm" x="616" y="92" font-size="12.5">Python</text><text class="mono pc" x="671.6" y="92" font-size="12.5">3.4%</text></g>
<g class="lg" style="animation-delay:0.24s"><circle cx="24" cy="114" r="4.5" fill="#e0af68"/><text class="mono nm" x="36" y="118" font-size="12.5">JavaScript</text><text class="mono pc" x="122.0" y="118" font-size="12.5">1.5%</text></g>
