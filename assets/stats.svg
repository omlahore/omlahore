<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 132" width="880" height="132" role="img" aria-label="12 pull requests merged upstream, 23 open, across 26 projects with 214 thousand combined stars.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .num { fill: #c9d3df; font-weight: 600 }
    .lbl { fill: #5b6673 }
    .hd  { fill: #5b6673 }
    .card { opacity: 0; animation: rise .6s ease-out forwards }
    @keyframes rise { from { opacity: 0 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1 } }
  </style>
  <rect width="880" height="132" rx="10" fill="#11151c" stroke="#1b2330"/>
  <text class="mono hd" x="20" y="22" font-size="11.5">contributions to other people's code</text>
  <g class="card" style="animation-delay:0.00s">
    <rect x="20" y="34" width="201" height="78" rx="8" fill="#161b23" stroke="#242c37"/>
    <text class="mono num" x="120" y="78" font-size="30" text-anchor="middle">12</text>
    <text class="mono lbl" x="120" y="98" font-size="11" text-anchor="middle">merged upstream</text>
  </g>
  <g class="card" style="animation-delay:0.12s">
    <rect x="233" y="34" width="201" height="78" rx="8" fill="#161b23" stroke="#242c37"/>
    <text class="mono num" x="333" y="78" font-size="30" text-anchor="middle">23</text>
    <text class="mono lbl" x="333" y="98" font-size="11" text-anchor="middle">open right now</text>
  </g>
  <g class="card" style="animation-delay:0.24s">
    <rect x="446" y="34" width="201" height="78" rx="8" fill="#161b23" stroke="#242c37"/>
    <text class="mono num" x="546" y="78" font-size="30" text-anchor="middle">26</text>
    <text class="mono lbl" x="546" y="98" font-size="11" text-anchor="middle">projects</text>
  </g>
  <g class="card" style="animation-delay:0.36s">
    <rect x="659" y="34" width="201" height="78" rx="8" fill="#161b23" stroke="#242c37"/>
    <text class="mono num" x="759" y="78" font-size="30" text-anchor="middle">214k</text>
    <text class="mono lbl" x="759" y="98" font-size="11" text-anchor="middle">combined stars</text>
  </g>
</svg>
